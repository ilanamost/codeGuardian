<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Code Reviewer</title>
    <!--
      Plan 042: GitHub Pages serves this file for any path it has no file for (a deep link, a reload,
      the GitHub sign-in return). It rewrites /base/some/path?x=1#h to /base/?/some/path&x=1#h, which
      loads index.html; the restore script in index.html puts the real URL back before React starts.
      Adapted from the spa-github-pages technique (MIT).
      The segment-count placeholder below is replaced at build time (vite.config.ts) by the number of segments
      in VITE_BASE_PATH: 0 for '/', 1 for '/ai-code-reviewer/'.
    -->
    <script>
      var pathSegmentsToKeep = __PATH_SEGMENTS_TO_KEEP__
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
